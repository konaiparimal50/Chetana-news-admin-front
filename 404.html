<!DOCTYPE html>
<html lang="bn">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', 'Hind Siliguri', sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  .bg-shape {
    position: absolute;
    border-radius: 50%;
    z-index: 0;
  }

  .bg-shape.one {
    width: 500px;
    height: 500px;
    background: #c1121f;
    opacity: 0.06;
    top: -150px;
    left: -150px;
  }

  .bg-shape.two {

    height: 400px;
    background: #c1121f;
    opacity: 0.08;
    bottom: -120px;
    right: -100px;
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 640px;
    width: 100%;
    padding: 60px 40px;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(193, 18, 31, 0.12);
    border-top: 6px solid #c1121f;
  }

  .logo-mark {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
    padding: 8px 20px;
    background: #c1121f;
    border-radius: 30px;
  }

  .logo-mark span {
    color: #ffffff;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
  }

  .error-code {
    font-size: 130px;
    font-weight: 800;
    color: #c1121f;
    line-height: 1;
    letter-spacing: -4px;
    text-shadow: 4px 4px 0px rgba(193, 18, 31, 0.1);
  }

  .divider-line {
    width: 70px;
    height: 4px;
    background: #c1121f;
    margin: 24px auto;
    border-radius: 2px;
  }

  .title-bn {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
  }

  .title-en {
    font-size: 18px;
    font-weight: 500;
    color: #c1121f;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }

  .desc-bn {
    font-family: 'Hind Siliguri', sans-serif;
    font-size: 16px;
    color: #555555;
    line-height: 1.8;
    margin-bottom: 6px;
  }

  .desc-en {
    font-size: 14px;
    color: #888888;
    line-height: 1.7;
    margin-bottom: 36px;
  }

  .btn-home {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #c1121f;
    color: #ffffff;
    text-decoration: none;
    padding: 15px 38px;
    border-radius: 50px;
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 10px 25px rgba(193, 18, 31, 0.3);
    transition: all 0.25s ease;
    border: 2px solid #c1121f;
  }

  .btn-home:hover {
    background: #ffffff;
    color: #c1121f;
    transform: translateY(-3px);
    box-shadow: 0 14px 30px rgba(193, 18, 31, 0.35);
  }

  .btn-home svg {
    width: 18px;
    height: 18px;
  }

  .footer-note {
    margin-top: 30px;
    font-size: 13px;
    color: #aaaaaa;
  }

  .footer-note .bn {
    font-family: 'Hind Siliguri', sans-serif;
  }

  @media (max-width: 480px) {
    .container {
      padding: 40px 24px;
    }
    .error-code {
      font-size: 90px;
    }
    .title-bn {
      font-size: 24px;

<body>

  <div class="bg-shape one"></div>
  <div class="bg-shape two"></div>

  <div class="container">
    <div class="logo-mark">

    </div>
